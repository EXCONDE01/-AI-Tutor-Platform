name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'

jobs:
  lint:
    name: Lint (ESLint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npx eslint src/functions/tutor.ts src/functions/chat.ts

  typecheck:
    name: Type Check (tsc --noEmit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript type check
        run: npx tsc --noEmit --noEmitOnError src/functions/tutor.ts src/functions/chat.ts

  test:
    name: Run Tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

  db-migrate:
    name: Database Migration (Preview Branch)
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    if: github.event_name == 'pull_request'
    env:
      NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Neon CLI
        run: npm install -g neonctl@latest

      - name: Authenticate with Neon
        run: neonctl auth --api-key ${{ secrets.NEON_API_KEY }}

      - name: Generate PR branch name
        id: branch-name
        run: |
          BRANCH_NAME="pr-${{ github.event.pull_request.number }}"
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT

      - name: Create or reset Neon preview branch
        id: create-branch
        run: |
          BRANCH_NAME="${{ steps.branch-name.outputs.branch_name }}"

          EXISTING=$(neonctl branches list --project-id $NEON_PROJECT_ID --output json | jq -r ".[] | select(.name == \"$BRANCH_NAME\") | .id")

          if [ -n "$EXISTING" ]; then
            echo "Branch $BRANCH_NAME already exists (ID: $EXISTING), resetting from parent..."
            neonctl branches reset $EXISTING --project-id $NEON_PROJECT_ID --parent main
            BRANCH_ID=$EXISTING
          else
            echo "Creating new branch $BRANCH_NAME from main..."
            RESULT=$(neonctl branches create $BRANCH_NAME --project-id $NEON_PROJECT_ID --parent main --output json)
            BRANCH_ID=$(echo $RESULT | jq -r '.id')
          fi

          CONNECTION_STRING=$(neonctl connection-string $BRANCH_ID --project-id $NEON_PROJECT_ID --role neon_admin --pooler transaction)

          echo "branch_id=$BRANCH_ID" >> $GITHUB_OUTPUT
          echo "database_url=$CONNECTION_STRING" >> $GITHUB_OUTPUT

      - name: Generate Drizzle migrations
        run: npm run db:generate

      - name: Apply migrations on preview branch
        run: |
          export DATABASE_URL="${{ steps.create-branch.outputs.database_url }}"
          npm run db:migrate

  build:
    name: Build (Next.js)
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Next.js build (type-check only, no deploy)
        run: npx tsc --noEmit
