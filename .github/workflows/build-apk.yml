name: Build Android APK

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_tutor
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Database connection for build
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/ai_tutor"
      NEON_DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/ai_tutor"
      NEXTAUTH_SECRET: "build-secret-do-not-use-in-production"
      NEXTAUTH_URL: "https://ai-tutor-platform-exconde.vercel.app"
      NEXT_PUBLIC_APP_URL: "https://ai-tutor-platform-exconde.vercel.app"
      # Disable telemetry
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Wait for PostgreSQL
        run: |
          echo "Waiting for PostgreSQL service to be healthy..."
          for i in {1..30}; do
            # Try to connect using node (available in PATH)
            if node -e "const net = require('net'); const client = new net.Socket(); client.setTimeout(1000); client.connect(5432, 'localhost', () => { client.destroy(); process.exit(0); }); client.on('error', () => process.exit(1)); client.on('timeout', () => process.exit(1));" 2>/dev/null; then
              echo "PostgreSQL is ready"
              break
            fi
            echo "Waiting for PostgreSQL... ($i/30)"
            sleep 2
          done

      - name: Install dependencies
        run: npm ci

      - name: Run database migrations
        run: npm run db:migrate

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Verify APK exists
        run: |
          ls -la android/app/build/outputs/apk/debug/
          test -f android/app/build/outputs/apk/debug/app-debug.apk && echo "APK found" || (echo "APK NOT FOUND" && exit 1)

      - name: Upload APK as Artifact (fallback)
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: apk-latest
          name: "Latest Android APK (Debug)"
          body: |
            Auto-built from commit ${{ github.sha }}
            
            **Installation:**
            1. Download `app-debug.apk`
            2. Enable "Install unknown apps" in Android settings
            3. Open the APK to install
            
            **Note:** This is a debug build for testing. For production, use the Release build.
          files: android/app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: false
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}